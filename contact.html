<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Get in touch — World Works Photography</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
.contact-hero{min-height:100vh;padding-top:78px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);position:relative;overflow:hidden;background:#0b0b0c}
.contact-visual{position:relative;min-height:calc(100vh - 78px);overflow:hidden;background:#0e0e10}
.contact-visual img{width:100%;height:100%;object-fit:contain;display:block;filter:contrast(1.03)}
.contact-visual::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,rgba(11,11,12,.7) 100%);z-index:1;pointer-events:none}
.contact-label{position:absolute;left:clamp(24px,4vw,60px);bottom:32px;z-index:2;font-size:9px;letter-spacing:.22em;color:#fff;opacity:.8}
.contact-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(50px,7vw,110px) clamp(32px,5vw,80px);position:relative}
.contact-copy::before{content:"CONTACT / 01";position:absolute;top:36px;right:clamp(32px,5vw,80px);font-size:9px;letter-spacing:.2em;color:var(--muted)}
.contact-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.25em;color:var(--muted);margin:0 0 24px}
.contact-copy h1{font-family:"Playfair Display",serif;font-weight:400;font-size:clamp(70px,8vw,132px);line-height:.8;letter-spacing:-.065em;margin:0 0 42px}
.contact-copy h1 em{font-style:italic}
.contact-copy p:not(.contact-eyebrow){max-width:390px;color:var(--muted);font-size:15px;line-height:1.9;margin:0 0 34px}
.contact-back{align-self:flex-start}
.contact-number{position:absolute;bottom:34px;right:clamp(32px,5vw,80px);font-family:"Playfair Display",serif;font-size:42px;color:rgba(255,255,255,.08);line-height:1}
@media(max-width:800px){
.contact-hero{grid-template-columns:1fr;padding-top:70px}
.contact-visual{min-height:50vh;height:50vh}
.contact-visual::before{background:linear-gradient(180deg,transparent 55%,rgba(11,11,12,.75) 100%)}
.contact-copy{min-height:50vh;padding:65px 25px 80px}
.contact-copy::before{top:28px;right:25px}
.contact-copy h1{font-size:clamp(64px,18vw,100px);margin-bottom:30px}
.contact-number{bottom:24px;right:25px}
}
</style>
<style>
/* WORLD WORKS — cinematic, Apple-inspired motion */
:root{--ww-ease:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:smooth;scroll-padding-top:88px}
.site-header, .nav{transition:background .45s ease,border-color .45s ease,backdrop-filter .45s ease}
nav a::after,.nav div a::after{transform-origin:left;transition:transform .45s var(--ww-ease)}
.button,.exhibited-label,.gallery-filter,.collection-arrow{transition:color .35s ease,background .35s ease,border-color .35s ease,transform .5s var(--ww-ease)}
.ww-progress{position:fixed;z-index:10001;top:0;left:0;width:100%;height:2px;pointer-events:none;background:rgba(255,255,255,.08)}
.ww-progress span{display:block;width:100%;height:100%;background:#f4f2ed;transform:scaleX(0);transform-origin:left center;will-change:transform}
.ww-reveal{opacity:0;transform:translate3d(0,28px,0);transition:opacity .9s var(--ww-ease),transform 1s var(--ww-ease);transition-delay:var(--ww-delay,0ms)}
.ww-reveal.ww-visible{opacity:1;transform:translate3d(0,0,0)}
.ww-reveal.ww-reveal-left{transform:translate3d(-24px,0,0)}
.ww-reveal.ww-reveal-left.ww-visible{transform:translate3d(0,0,0)}
.ww-reveal.ww-reveal-right{transform:translate3d(24px,0,0)}
.ww-reveal.ww-reveal-right.ww-visible{transform:translate3d(0,0,0)}
.collection-card,.gallery .photo,.item,.feature img,.contact-visual img{backface-visibility:hidden}
.collection-card{transition:transform .8s var(--ww-ease),border-color .5s ease}
.collection-card:hover{transform:translate3d(0,-4px,0);border-color:rgba(255,255,255,.25)}
.item img,.collection-image img,.feature img,.contact-visual img{transition:transform 1.1s var(--ww-ease),filter .8s ease}
.item:hover img{transform:scale(1.025)}
.button:hover,.exhibited-label:hover{transform:translateY(-2px)}
.gallery .photo-button{transition:opacity .45s ease,transform .7s var(--ww-ease)}
.gallery .photo-button:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .ww-reveal,.ww-reveal.ww-reveal-left,.ww-reveal.ww-reveal-right{opacity:1;transform:none;transition:none}
 .ww-progress{display:none}
 .collection-card,.gallery .photo-button,.button,.exhibited-label{transition:none}
}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html" aria-label="World Works Photography home"><span class="brand-mark"><img src="favicon.svg" alt="World Works Photography" decoding="async"></span><span><strong>World Works</strong><small>Photography</small></span></a>
<nav aria-label="Main navigation"><a href="gallery.html">Gallery</a><a href="collections.html">Collections</a><a href="index.html#work">Work</a><a href="index.html#about">About</a><a href="contact.html" class="active">Contact</a></nav>
</header>
<main class="contact-hero">
<section class="contact-visual">
<img src="images/13.jpg" alt="Patience">
<span class="contact-label">WORLD WORKS / CONTACT</span>
</section>
<section class="contact-copy">
<p class="contact-eyebrow">Get in touch</p>
<h1>Let's<br><em>talk.</em></h1>
<p>World Works Photography is always open to new conversations, ideas and opportunities surrounding the work.</p>
<a class="button contact-back" href="index.html">Back to World Works <span>→</span></a>
<span class="contact-number">01</span>
</section>
</main>

<script>
/* World Works cinematic motion system — accessible and lightweight */
(()=> {
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const progress=document.createElement('div');
  progress.className='ww-progress';
  progress.setAttribute('aria-hidden','true');
  progress.innerHTML='<span></span>';
  if(!reduceMotion) document.body.appendChild(progress);
  const bar=progress.querySelector('span');
  let ticking=false;
  const updateProgress=()=>{
    const max=document.documentElement.scrollHeight-window.innerHeight;
    if(bar) bar.style.transform='scaleX('+(max>0?Math.min(1,window.scrollY/max):0)+')';
    ticking=false;
  };
  window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateProgress);ticking=true}},{passive:true});
  updateProgress();
  const revealSelectors=[
    '.hero-copy','.hero-content','.intro','.section','.feature','.about','.contact',
    '.gallery-page-header','.gallery-heading','.gallery-filters','.gallery .photo',
    '.collections-hero','.collections-intro','.collection-card','.collections-footer',
    '.contact-visual','.contact-copy','.head','.item'
  ];
  const targets=[...new Set(revealSelectors.flatMap(s=>Array.from(document.querySelectorAll(s))))];
  targets.forEach((el,i)=>{
    el.classList.add('ww-reveal');
    if(el.matches('.about img,.contact-visual')) el.classList.add('ww-reveal-left');
    if(el.matches('.feature-meta,.contact-copy')) el.style.setProperty('--ww-delay','90ms');
    if(el.matches('.gallery .photo,.collection-card,.item')) el.style.setProperty('--ww-delay',Math.min((i%5)*65,260)+'ms');
  });
  if(reduceMotion||!('IntersectionObserver' in window)){
    targets.forEach(el=>el.classList.add('ww-visible'));
  }else{
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){entry.target.classList.add('ww-visible');observer.unobserve(entry.target)}
      });
    },{threshold:.08,rootMargin:'0px 0px -6% 0px'});
    targets.forEach(el=>observer.observe(el));
  }
  const heroImage=document.querySelector('.hero img');
  if(heroImage&&!reduceMotion&&window.matchMedia('(min-width: 700px)').matches){
    let heroTick=false;
    window.addEventListener('scroll',()=>{
      if(heroTick)return;
      heroTick=true;
      requestAnimationFrame(()=>{
        const y=Math.min(window.scrollY,window.innerHeight);
        heroImage.style.setProperty('--ww-scroll',y);
        heroImage.style.translate='0 '+(y*.08)+'px';
        heroTick=false;
      });
    },{passive:true});
  }
})();
</script>

</body>
</html>
