<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Get in touch — World Works Photography</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<style>
.contact-page{min-height:100vh;padding-top:78px;display:grid;grid-template-columns:1.05fr .95fr}
.contact-page-image{min-height:calc(100vh - 78px);position:relative;overflow:hidden;background:#0e0e10}
.contact-page-image img{width:100%;height:100%;object-fit:cover;display:block}
.contact-page-image::after{content:"WORLD WORKS / CONTACT";position:absolute;left:clamp(22px,4vw,55px);bottom:30px;font-size:9px;letter-spacing:.2em;color:#fff;text-shadow:0 2px 8px #000}
.contact-page-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(60px,8vw,120px);background:#0b0b0c}
.contact-page-copy .eyebrow{margin-bottom:18px}
.contact-page-copy h1{font-size:clamp(64px,8vw,125px);line-height:.84;letter-spacing:-.06em;margin-bottom:30px}
.contact-page-copy p{max-width:460px;color:var(--muted);font-size:15px;line-height:1.8;margin:0 0 28px}
.contact-back{margin-top:10px}
@media(max-width:800px){.contact-page{grid-template-columns:1fr}.contact-page-image{min-height:48vh;height:48vh}.contact-page-copy{padding:70px 25px}.contact-page-copy h1{font-size:clamp(58px,15vw,90px)}}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html" aria-label="World Works Photography home"><span class="brand-mark"><img src="favicon.svg" alt="World Works Photography" decoding="async"></span><span><strong>World Works</strong><small>Photography</small></span></a>
<nav aria-label="Main navigation"><a href="gallery.html">Gallery</a><a href="index.html#work">Work</a><a href="index.html#about">About</a><a href="contact.html" class="active">Contact</a></nav>
</header>
<main class="contact-page">
<div class="contact-page-image"><img src="images/13.jpg" alt="Patience"><div></div></div>
<section class="contact-page-copy">
<p class="eyebrow">Get in touch</p>
<h1>Let's<br><em>talk.</em></h1>
<p>World Works Photography is always open to new conversations, ideas and opportunities surrounding the work.</p>
<a class="button contact-back" href="index.html">Back to World Works <span>→</span></a>
</section>
</main>
</body>
</html>
